name: Build

on:
  workflow_call:

jobs:
  run-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build
